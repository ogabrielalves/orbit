[package]
name = "orbit"
version = "0.1.0"
description = "Local-first desktop app for projects, Kanban boards, notes and a knowledge graph"
license = "MIT"
authors = ["Gabriel Alves"]
edition = "2024"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite_migration = "2.6.0"
thiserror = "2.0.21"
chrono = "0.4.45"
notify = "8.2.1"
uuid = { version = "1.29.1", features = ["v7"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
rusqlite = { version = "0.40", features = ["bundled"] }
specta-typescript = "=0.0.13"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
log = "0.4"
tauri-plugin-log = "2"


[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
